name: Release

on:
  push:
    branches: [main]
    paths:
      - "nd2_multipos_splitter.py"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Publish latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest
          body: >
            Always points to the most recent version of
            `nd2_multipos_splitter.py` on `main`.
          files: nd2_multipos_splitter.py
